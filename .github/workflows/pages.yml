name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recupera il sito
        uses: actions/checkout@v4
      - name: Prepara i file statici
        run: |
          mkdir -p _site
          cp index.html stile.css simulazione.css comunita.css engine.js storia.js comunita-map.js comunita-app.js .nojekyll _site/
          test -f _site/index.html
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Carica l'artefatto
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v4
