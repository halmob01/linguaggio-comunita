name: Test simulatore
on:
  push:
    branches: [feat/primo-simulatore, main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controllo sintattico JavaScript
        run: |
          node --check engine.js
          node --check storia.js
          node --check comunita-map.js
          node --check comunita-app.js
      - name: Test logica e struttura
        run: node --test tests/*.test.cjs
